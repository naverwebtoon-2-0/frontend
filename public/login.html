<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>작가 로그인 · 울림툰</title>
  <link rel="preload" href="/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" type="module"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header__identity"><a class="app-header__brand" href="/">울림툰</a><span>작가 로그인</span></div>
    <div class="app-header__account"><a class="badge badge--link" href="/">독자 모드</a></div>
  </header>
  <main class="login-main">
    <section class="card login-card" aria-labelledby="login-title">
      <div class="login-heading">
        <h1 class="heading" id="login-title">작가 로그인</h1>
        <p>작품 제작과 검수를 계속하려면 작가 계정으로 로그인하세요.</p>
      </div>
      <form class="login-form" id="login-form">
        <label>이메일<input name="email" type="email" autocomplete="username" required></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
        <p class="load-error" id="login-error" role="alert" hidden></p>
        <button class="button button--primary" type="submit">로그인</button>
      </form>
    </section>
  </main>
</body>
</html>
