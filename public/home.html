<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>울림툰 · 오디오 웹툰</title>
  <link rel="preload" href="/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/modal.css">
  <link rel="stylesheet" href="/reader.css">
  <script src="/home.js" type="module"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header__identity">
      <a class="app-header__brand" href="/">울림툰</a>
      <span>작품 탐색</span>
    </div>
    <div class="app-header__account">
      <span class="nav-pending">도움말 · 준비 중</span>
      <a class="badge badge--link" href="/dashboard" title="작가 화면으로 전환" aria-label="독자 모드, 작가 화면으로 전환">독자 모드</a>
    </div>
  </header>

  <main class="reader-main" id="home" aria-busy="true">
    <h1 class="visually-hidden">울림툰 오디오 웹툰</h1>

    <!-- 검색과 접근성 빠른 설정 (Figma 33:861) -->
    <div class="home-toolbar">
      <form class="search" role="search" id="search-form">
        <label class="visually-hidden" for="search-input">작품 검색</label>
        <input id="search-input" name="q" type="search" placeholder="작품명, 작가 또는 장르 검색" autocomplete="off">
        <button type="submit">검색</button>
      </form>
      <div class="quick-actions">
        <button class="button" id="toggle-contrast" type="button" aria-pressed="false">고대비</button>
        <button class="button" id="cycle-text" type="button" aria-describedby="text-scale">글자 크기 <span class="muted" id="text-scale">100%</span></button>
        <button class="button button--secondary" id="open-settings" type="button" aria-haspopup="dialog">감상 설정</button>
      </div>
    </div>

    <div class="load-error" id="load-error" role="alert" hidden>
      <p>작품 목록을 불러오지 못했습니다.</p>
      <button class="button button--secondary" id="retry" type="button">다시 시도</button>
    </div>

    <!-- 이어 듣기 (Figma 33:869) -->
    <section class="continue" id="continue" aria-labelledby="continue-title" hidden>
      <div class="continue__copy">
        <p class="text-small muted" data-slot="continue-label">이어 듣기</p>
        <h2 class="heading" id="continue-title" data-slot="continue-title"></h2>
        <p data-slot="continue-detail"></p>
        <div class="continue__progress" id="continue-progress" role="progressbar" aria-label="감상 진행률"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        <a class="button button--primary" id="continue-link" href="#" data-slot="continue-action">계속 듣기</a>
      </div>
      <div class="cover" id="continue-cover" aria-hidden="true"></div>
    </section>

    <!-- 새로 올라온 오디오 웹툰 (Figma 33:879) -->
    <section aria-labelledby="list-title">
      <div class="section-heading">
        <h2 id="list-title" data-slot="list-title">새로 올라온 오디오 웹툰</h2>
        <button class="button" id="clear-search" type="button" hidden>검색 지우기</button>
      </div>
      <ul class="webtoon-grid" id="webtoon-grid" aria-live="polite"></ul>
      <p class="empty-state" id="empty" hidden>검색 결과가 없습니다. 다른 작품명이나 장르로 찾아보세요.</p>
    </section>
  </main>

  <template id="webtoon-card">
    <li>
      <a class="webtoon-card">
        <span class="cover" aria-hidden="true" data-slot="cover"></span>
        <strong data-slot="title"></strong>
        <span class="text-small muted" data-slot="meta"></span>
        <span class="text-small muted" data-slot="count"></span>
      </a>
    </li>
  </template>

  <!-- 감상 설정 -->
  <dialog class="modal modal--narrow" id="settings-modal" aria-labelledby="settings-title">
    <div class="modal__body">
      <div class="modal__heading">
        <h2 id="settings-title">감상 설정</h2>
        <p>이 브라우저에 저장되며, 모든 작품 감상에 적용됩니다.</p>
      </div>
      <hr class="modal__divider">
      <div id="settings-form"></div>
      <div class="modal__actions">
        <button class="modal__button modal__button--primary" type="button" data-close>닫기</button>
      </div>
    </div>
  </dialog>
</body>
</html>
