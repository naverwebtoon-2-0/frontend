<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 처리 진행 · 울림툰</title>
  <link rel="preload" href="/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
  <script src="/processing.js" type="module"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header__identity">
      <a class="app-header__brand" href="/dashboard">울림툰</a>
      <span>작가 대시보드</span>
    </div>
    <div class="app-header__account">
      <a class="link" href="#help">도움말</a>
      <span class="badge">작가 모드</span>
      <span data-slot="author-name"></span>
    </div>
  </header>

  <div class="author-layout">
    <nav class="author-sidebar" aria-label="작가 메뉴">
      <p class="author-sidebar__label">작가 메뉴</p>
      <ul>
        <li><a class="nav-item" href="/dashboard">대시보드</a></li>
        <li><a class="nav-item" href="#works">작품 관리</a></li>
        <li><a class="nav-item" href="/upload" aria-current="page">새 회차 업로드</a></li>
        <li><a class="nav-item" href="#notifications">알림</a></li>
        <li><a class="nav-item" href="#settings">설정</a></li>
      </ul>
    </nav>

    <main class="author-main author-main--center">
      <section class="card process-card" id="job" aria-busy="true" aria-labelledby="job-title">
        <div class="process-card__heading">
          <h1 class="heading" id="job-title" data-slot="headline">오디오 초안을 만들고 있습니다</h1>
          <p data-slot="episode">&nbsp;</p>
          <p class="text-small" data-slot="hint">페이지를 닫아도 작업은 계속됩니다.</p>
        </div>

        <div class="progress">
          <div class="progress__copy">
            <span id="overall-label">전체 진행률</span>
            <span data-slot="overall" aria-live="polite"></span>
          </div>
          <div class="progress__track progress__track--lg" id="overall-progress" role="progressbar"
               aria-labelledby="overall-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress__value"></div>
          </div>
        </div>

        <ol class="process-steps" id="steps" aria-label="처리 단계"></ol>

        <div class="load-error" id="load-error" role="alert" hidden>
          <p data-slot="error">작업 상태를 불러오지 못했습니다.</p>
          <button class="button button--secondary" id="retry" type="button">다시 시도</button>
        </div>

        <div class="process-card__actions">
          <span class="text-small" data-slot="errors"></span>
          <div class="process-card__buttons">
            <a class="button button--secondary" id="next-action" href="#studio" hidden>검수 시작</a>
            <a class="button" href="/dashboard">대시보드로 이동</a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <template id="process-step">
    <li class="process-step">
      <span class="process-step__marker" aria-hidden="true" data-slot="marker"></span>
      <span class="process-step__copy">
        <strong data-slot="label"></strong>
        <span class="text-small" data-slot="detail"></span>
      </span>
    </li>
  </template>
</body>
</html>
